<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БазалТех :: История запросов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="home.html">
                <i class="fas fa-gem text-primary me-1"></i> БАЗАЛТЕХ
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="home.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link active" href="history.html">История запросов</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fas fa-user"></i> Личный кабинет</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html"><i class="fas fa-cog"></i> Админка</a></li>
                    <li class="nav-item"><a class="nav-link" href="auth.html"><i class="fas fa-sign-out-alt"></i> Выход</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4 page">
        <h3>История запросов</h3>
        
        <div class="card mb-3 p-2 bg-light">
            <div class="row g-2">
                <div class="col-md-3">
                    <input type="text" class="form-control" placeholder="Ключевые слова">
                </div>
                <div class="col-md-2">
                    <input type="date" class="form-control">
                </div>
                <div class="col-md-2">
                    <select class="form-select">
                        <option value="">Проект</option>
                        <option value="basalt">Базальт</option>
                        <option value="salt">Соли</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select">
                        <option value="">Статус</option>
                        <option value="inwork">В работе</option>
                        <option value="completed">Завершено</option>
                        <option value="error">Ошибка</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100">Применить фильтры</button>
                </div>
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table table-hover" id="historyTable">
                <thead class="table-light">
                    <tr>
                        <th>Проект</th>
                        <th>Ключевые слова</th>
                        <th>Дата запуска</th>
                        <th>Дата результата</th>
                        <th>Статус</th>
                        <th>Оценки компаний</th>
                        <th>Комментарии</th>
                    </tr>
                </thead>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
