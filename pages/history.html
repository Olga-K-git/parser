<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БазалТех :: История запросов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="home.html">
                <i class="fas fa-gem text-primary me-1"></i> БАЗАЛТЕХ
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="home.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link active" href="history.html">История запросов</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fas fa-user"></i> Личный кабинет</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html"><i class="fas fa-cog"></i> Админка</a></li>
                    <li class="nav-item"><a class="nav-link" href="auth.html"><i class="fas fa-sign-out-alt"></i> Выход</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4 page">
        <h3>История запросов</h3>
        
        <div class="card mb-3 p-2 bg-light">
            <div class="row g-2">
                <div class="col-md-3">
                    <input type="text" class="form-control" id="filterKeywords" placeholder="Ключевые слова">
                </div>
                <div class="col-md-2">
                    <input type="date" class="form-control" id="filterDate">
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="filterProject">
                        <option value="">Проект</option>
                        <option value="basalt">Базальт</option>
                        <option value="salt">Соли</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="filterStatus">
                        <option value="">Статус</option>
                        <option value="inwork">В работе</option>
                        <option value="completed">Завершено</option>
                        <option value="error">Ошибка</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" id="applyHistoryFilters">Применить</button>
                </div>
            </div>
        </div>

        <!-- Индикатор загрузки -->
        <div id="loadingIndicator" class="text-center py-4" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
            <p class="mt-2 text-muted">Загрузка истории запросов...</p>
        </div>

        <!-- Сообщение об ошибке -->
        <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
        
        <div class="table-responsive">
            <table class="table table-hover" id="historyTable">
                <thead class="table-light">
                    <tr>
                        <th>Проект</th>
                        <th>Ключевые слова</th>
                        <th>Дата запуска</th>
                        <th>Дата результата</th>
                        <th>Статус</th>
                        <th>Оценки компаний</th>
                        <th>Комментарии</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <!-- Данные будут загружены через API -->
                </tbody>
            </table>
        </div>

        <!-- Сообщение о пустой истории -->
        <div id="emptyHistory" class="text-center text-muted py-4" style="display: none;">
            <i class="fas fa-inbox fa-3x mb-3"></i>
            <p>История запросов пуста</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ==================== ЗАГРУЗКА ДАННЫХ ИЗ API ====================
        let allQueries = [];
        let filteredQueries = [];

        async function loadSearchQueries() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            const errorMessage = document.getElementById('errorMessage');
            const historyBody = document.getElementById('historyBody');
            const emptyHistory = document.getElementById('emptyHistory');
            const historyTable = document.getElementById('historyTable');

            loadingIndicator.style.display = 'block';
            errorMessage.style.display = 'none';
            historyTable.style.display = 'none';
            emptyHistory.style.display = 'none';

            try {
                const response = await fetch('api/search-queries.json');
                
                if (!response.ok) {
                    throw new Error(`Ошибка HTTP: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                
                allQueries = data.queries || data;
                filteredQueries = [...allQueries];

                loadingIndicator.style.display = 'none';

                if (filteredQueries.length === 0) {
                    emptyHistory.style.display = 'block';
                } else {
                    historyTable.style.display = 'table';
                    renderHistoryTable(filteredQueries);
                }

            } catch (error) {
                loadingIndicator.style.display = 'none';
                errorMessage.style.display = 'block';
                errorMessage.innerHTML = `
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    Ошибка загрузки данных: ${error.message}. 
                    <button class="btn btn-sm btn-outline-danger ms-2" onclick="loadSearchQueries()">Повторить</button>
                `;
                console.error('Ошибка загрузки:', error);
            }
        }

        function renderHistoryTable(queries) {
            const historyBody = document.getElementById('historyBody');
            historyBody.innerHTML = '';

            queries.forEach(query => {
                const row = document.createElement('tr');
                row.style.cursor = 'pointer';
                row.addEventListener('click', () => {
                    window.location.href = `result.html?id=${query.id}`;
                });

                let statusClass = 'status-inwork';
                let statusText = 'в работе';
                
                if (query.status === 'completed') {
                    statusClass = 'status-completed';
                    statusText = 'завершено';
                } else if (query.status === 'error') {
                    statusClass = 'status-error';
                    statusText = 'ошибка';
                }

                const keywords = query.keywords || '';
                const keywordsDisplay = keywords.length > 30 
                    ? keywords.substring(0, 27) + '…' 
                    : keywords;
                
                const keywordsTitle = keywords.length > 30 ? keywords : '';

                const startDate = query.startDate || '—';
                const endDate = query.endDate || '—';

                const ratings = getRatingsSummary(query.companyData);
                
                const comments = getCommentsSummary(query.companyData);
                const commentsTitle = comments !== '—' ? comments : '';

                row.innerHTML = `
                    <td>${escapeHtml(query.project || '')}</td>
                    <td title="${escapeHtml(keywordsTitle)}">${escapeHtml(keywordsDisplay)}</td>
                    <td>${escapeHtml(startDate)}</td>
                    <td>${escapeHtml(endDate)}</td>
                    <td><span class="${statusClass}">${statusText}</span></td>
                    <td>${ratings}</td>
                    <td><span class="comment-text" title="${escapeHtml(commentsTitle)}">${escapeHtml(comments)}</span></td>
                `;

                historyBody.appendChild(row);
            });
        }

        function getRatingsSummary(companyData) {
            if (!companyData || Object.keys(companyData).length === 0) return '—';
            
            let suitable = 0;
            let notSuitable = 0;
            let total = 0;
            
            Object.values(companyData).forEach(value => {
                if (value.rating === 'suitable') suitable++;
                if (value.rating === 'not_suitable') notSuitable++;
                if (value.rating) total++;
            });
            
            // Если нет ни одной оценки
            if (total === 0) return '—';
            
            // Если все оценённые компании "подошли"
            if (suitable > 0 && notSuitable === 0) {
                return '<span class="badge-suitable">Подошёл</span>';
            }
            
            // Если все оценённые компании "не подошли"
            if (notSuitable > 0 && suitable === 0) {
                return '<span class="badge-not-suitable">Не подошёл</span>';
            }
            
            // Если есть и те и другие оценки
            if (suitable > 0 && notSuitable > 0) {
                return `<div class="badge-mixed">
                    <span class="badge-suitable">Подошёл</span>
                    <span class="badge-not-suitable">Не подошёл</span>
                </div>`;
            }
            
            return '—';
        }

        function getCommentsSummary(companyData) {
            if (!companyData || Object.keys(companyData).length === 0) return '—';
            
            const comments = Object.values(companyData)
                .map(value => value.comment)
                .filter(comment => comment && comment.trim().length > 0);
            
            if (comments.length === 0) return '—';
            if (comments.length === 1) {
                return comments[0].substring(0, 30) + (comments[0].length > 30 ? '…' : '');
            }
            return `${comments.length} коммент.`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        document.getElementById('applyHistoryFilters').addEventListener('click', () => {
            const keywordFilter = document.getElementById('filterKeywords').value.toLowerCase().trim();
            const dateFilter = document.getElementById('filterDate').value;
            const projectFilter = document.getElementById('filterProject').value;
            const statusFilter = document.getElementById('filterStatus').value;

            filteredQueries = allQueries.filter(query => {
                if (keywordFilter && !query.keywords.toLowerCase().includes(keywordFilter)) {
                    return false;
                }

                if (dateFilter && query.startDate) {
                    const queryDate = query.startDate.split(',')[0].trim();
                    if (queryDate !== dateFilter) {
                        return false;
                    }
                }

                if (projectFilter && query.project !== projectFilter) {
                    return false;
                }

                if (statusFilter && query.status !== statusFilter) {
                    return false;
                }

                return true;
            });

            const historyTable = document.getElementById('historyTable');
            const emptyHistory = document.getElementById('emptyHistory');

            if (filteredQueries.length === 0) {
                historyTable.style.display = 'none';
                emptyHistory.style.display = 'block';
                emptyHistory.innerHTML = `
                    <i class="fas fa-search fa-3x mb-3"></i>
                    <p>По вашему запросу ничего не найдено</p>
                    <button class="btn btn-sm btn-outline-primary" onclick="resetFilters()">Сбросить фильтры</button>
                `;
            } else {
                historyTable.style.display = 'table';
                emptyHistory.style.display = 'none';
                renderHistoryTable(filteredQueries);
            }
        });

        function resetFilters() {
            document.getElementById('filterKeywords').value = '';
            document.getElementById('filterDate').value = '';
            document.getElementById('filterProject').value = '';
            document.getElementById('filterStatus').value = '';
            
            filteredQueries = [...allQueries];
            
            document.getElementById('historyTable').style.display = 'table';
            document.getElementById('emptyHistory').style.display = 'none';
            renderHistoryTable(filteredQueries);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSearchQueries();
        });
    </script>
</body>
</html>
