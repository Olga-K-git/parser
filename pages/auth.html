<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БазалТех :: Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="home.html">
                <i class="fas fa-gem text-primary me-1"></i> БАЗАЛТЕХ
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="auth.html">Вход</a></li>
                    <li class="nav-item"><a class="nav-link" href="home.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="history.html">История</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Профиль</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html">Админка</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4 page">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Вход в систему</h3>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Логин (email)</label>
                                <input type="email" class="form-control" id="loginEmail" value="operator@basalt.ru" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="loginPassword" value="operator123" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Роль (для нового пользователя)</label>
                                <select class="form-select" id="loginRole">
                                    <option value="marketer">Маркетолог</option>
                                    <option value="operator">Оператор</option>
                                    <option value="admin">Администратор</option>
                                </select>
                                <div class="form-text">Если пользователь уже существует, роль берётся из базы.</div>
                            </div>
                            <a href="home.html" class="btn btn-primary w-100">Продолжить</a>
                            <div class="alert alert-danger mt-3 small" id="loginError" style="display: none;"></div>
                        </form>
                        <hr>
                        <div class="text-center">
                            <a href="forgot.html">Запросить смену пароля</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
