<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БазалТех :: Главная</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="home.html">
                <i class="fas fa-gem text-primary me-1"></i> БАЗАЛТЕХ
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="home.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="history.html">История запросов</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fas fa-user"></i> Личный кабинет</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html"><i class="fas fa-cog"></i> Админка</a></li>
                    <li class="nav-item"><a class="nav-link" href="auth.html"><i class="fas fa-sign-out-alt"></i> Выход</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4 page">
        <div class="card mb-4 bg-light">
            <div class="card-body">
                <h6 class="text-muted">Последний запрос</h6>
                <div id="lastRequestInfo">
                    <strong>Ключевые слова:</strong> базальтовое волокно, композит<br>
                    <strong>Статус:</strong> <span class="status-completed">завершено</span><br>
                    <strong>Дата:</strong> 02.05.2026, 10:30:00
                </div>
            </div>
        </div>
        
        <div class="chat-container p-3">
            
            <div id="searchBlock" class="input-group">
                <input type="text" class="form-control" id="searchInput" placeholder="Пример: базальтовое волокно, композит, огнезащита">
                <button class="btn btn-outline-secondary" id="filterBtn"><i class="fas fa-sliders-h"></i></button>
                <button class="btn btn-primary" id="sendSearchBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
            
            <div id="filterPanel" class="mt-3 p-3 bg-light rounded" style="display: none;">
                <h6>Фильтры</h6>
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label">Страна</label>
                        <select class="form-select" id="filterCountry" multiple size="3">
                            <option value="ru">Россия</option>
                            <option value="by">Беларусь</option>
                            <option value="kz">Казахстан</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Предметная область</label>
                        <select class="form-select" id="filterSubject" multiple size="3">
                            <option value="basalt">Базальт</option>
                            <option value="composite">Композиты</option>
                            <option value="fire">Огнезащита</option>
                        </select>
                    </div>
                </div>
                <div class="mt-2">
                    <button class="btn btn-sm btn-secondary" id="resetFilters">Сбросить</button>
                    <button class="btn btn-sm btn-primary" id="applyFilters">Применить</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Демо функциональность фильтров
        document.getElementById('filterBtn').addEventListener('click', function() {
            const panel = document.getElementById('filterPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });
        
        document.getElementById('resetFilters').addEventListener('click', function() {
            document.querySelectorAll('#filterCountry option, #filterSubject option').forEach(opt => {
                opt.selected = false;
            });
        });
        
        document.getElementById('applyFilters').addEventListener('click', function() {
            document.getElementById('filterPanel').style.display = 'none';
            alert('Фильтры применены (демо)');
        });
        
        document.getElementById('sendSearchBtn').addEventListener('click', function() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                alert(`Поиск запущен: ${query}\n(демо-режим)`);
                document.getElementById('searchInput').value = '';
                window.location.href = 'result.html';
            } else {
                alert('Введите ключевые слова для поиска');
            }
        });
    </script>
</body>
</html>
