<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БазалТех :: Смена пароля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/home">
                <i class="fas fa-gem text-primary me-1"></i> БАЗАЛТЕХ
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/auth">Вход</a></li>
                    <li class="nav-item"><a class="nav-link" href="/home">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="/history">История</a></li>
                    <li class="nav-item"><a class="nav-link" href="/profile">Профиль</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin">Админка</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4 page">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Смена пароля</h3>
                        <form id="forgotForm">
                            <div class="mb-3">
                                <label class="form-label">Логин пользователя (email)</label>
                                <input type="email" class="form-control" id="forgotEmail" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Новый пароль</label>
                                <input type="password" class="form-control" id="forgotNewPass" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Повтор пароля</label>
                                <input type="password" class="form-control" id="forgotNewPassConfirm" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Сменить пароль</button>
                            <div class="alert alert-success mt-3 small" id="forgotSuccess" style="display: none;"></div>
                            <div class="alert alert-danger mt-3 small" id="forgotError" style="display: none;"></div>
                        </form>
                        <div class="text-center mt-3">
                            <a href="/auth">Вернуться ко входу</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
